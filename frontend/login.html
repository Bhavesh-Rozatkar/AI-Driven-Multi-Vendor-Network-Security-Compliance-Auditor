<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Network Compliance Console</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login-page"><div class="login-wrap"><section class="login-brand"><div class="mark">NC</div><h1>Network Compliance Console</h1><div class="login-points"><div>01 · Direct pfSense device assessment over SSH</div><div>02 · CIS benchmark upload, review and activation</div><div>03 · AI analysis → safety validation → administrator approval</div><div>04 · Verified remediation and audit trail</div></div></section><section class="login-form"><h2>Administrator sign in</h2><form id="loginForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">Sign in</button><div id="error" class="error"></div></form><div class="login-help">Credentials: <b>admin</b> / <b>admin@123</b></div></section></div></main><script>
const form=document.getElementById('loginForm');form.addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');sessionStorage.setItem('sihUser',d.username);location.href='/connection'}catch(err){error.textContent=err.message}});
</script></body></html>
